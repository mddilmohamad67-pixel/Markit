openapi: 3.0.0
info:
  title: Markit API
  version: 0.1.0
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/products:
    get:
      summary: List products
      responses:
        '200':
          description: array of products
    post:
      summary: Create product (protected)
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: created
components:
  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
